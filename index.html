<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reloj Minecraft</title>

<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.box {
  background: #020617;
  padding: 24px;
  border-radius: 22px;
  width: 330px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,.5);
}
h1 {
  margin: 0 0 10px;
  font-size: 1.3rem;
}
.time {
  font-size: 3.2rem;
  font-weight: bold;
  margin: 10px 0;
}
.state {
  font-size: 1.1rem;
}
.day { color: #fde047; }
.night { color: #60a5fa; }
button {
  margin-top: 14px;
  padding: 10px 16px;
  border-radius: 12px;
  border: none;
  background: #2563eb;
  color: white;
  font-size: .9rem;
}
.note {
  margin-top: 10px;
  font-size: .8rem;
  opacity: .7;
}
</style>
</head>

<body>
<div class="box">
  <h1>⏰ Hora Minecraft</h1>
  <div class="time" id="time">--:--</div>
  <div class="state" id="state">---</div>

  <button onclick="syncTime()">🔄 Sincronizar hora</button>

  <div class="note">La hora queda guardada automáticamente</div>
</div>

<script>
const REAL_MS_PER_MC_MIN = (50 / 60) * 1000;
const MC_MIN_PER_DAY = 1440;

// Cargar datos guardados
let mcStartMinutes = localStorage.getItem("mcStartMinutes");
let realStart = localStorage.getItem("realStart");

if (!mcStartMinutes || !realStart) {
  mcStartMinutes = 6 * 60; // 06:00 default
  realStart = Date.now();
  localStorage.setItem("mcStartMinutes", mcStartMinutes);
  localStorage.setItem("realStart", realStart);
}

mcStartMinutes = Number(mcStartMinutes);
realStart = Number(realStart);

function syncTime() {
  const input = prompt("Hora actual del server (HH:MM)");
  if (!input) return;

  const [h, m] = input.split(":").map(Number);
  if (
    isNaN(h) || isNaN(m) ||
    h < 0 || h > 23 ||
    m < 0 || m > 59
  ) {
    alert("Formato inválido");
    return;
  }

  mcStartMinutes = h * 60 + m;
  realStart = Date.now();

  localStorage.setItem("mcStartMinutes", mcStartMinutes);
  localStorage.setItem("realStart", realStart);
}

function update() {
  const elapsedMcMin = (Date.now() - realStart) / REAL_MS_PER_MC_MIN;
  const total = (mcStartMinutes + elapsedMcMin) % MC_MIN_PER_DAY;

  const h = Math.floor(total / 60);
  const m = Math.floor(total % 60);

  document.getElementById("time").textContent =
    String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");

  const state = document.getElementById("state");
  if (h >= 6 && h < 18) {
    state.textContent = "☀️ Día";
    state.className = "state day";
  } else {
    state.textContent = "🌙 Noche";
    state.className = "state night";
  }
}

update();
setInterval(update, 200);
</script>
</body>
</html>
